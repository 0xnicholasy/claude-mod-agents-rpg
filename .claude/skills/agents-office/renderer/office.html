<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #2B2D3A; overflow: hidden; image-rendering: pixelated; }
  #stage { position: absolute; left: 0; top: 0; width: 608px; height: 368px; transform-origin: 0 0; }
  #office { position: relative; width: 608px; height: 368px; overflow: hidden; background: #1c1e26; image-rendering: pixelated; }
  .zone { position: absolute; }
  #team { left: 0; top: 56px; width: 380px; height: 312px;
    background:
      repeating-linear-gradient(0deg, #8a5a30 0 2px, transparent 2px 16px),
      repeating-linear-gradient(90deg, rgba(60,30,10,.28) 0 2px, transparent 2px 64px),
      #b8824c; }
  #meet { left: 388px; top: 184px; width: 220px; height: 184px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 24px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, transparent 2px 24px),
      #3f5a8a; }
  #kitchen { left: 388px; top: 56px; width: 220px; height: 120px;
    background: repeating-conic-gradient(#d9d3c5 0 25%, #bdb6a5 0 50%) 0 0 / 32px 32px; }
  .wall { position: absolute; background: #4a5068; box-shadow: inset 0 -6px 0 #353a4e; z-index: 1; }
  #wall-top { left: 0; top: 0; width: 608px; height: 56px; }
  #wall-v { left: 380px; top: 56px; width: 8px; height: 194px; box-shadow: inset -2px 0 0 #353a4e; }
  #wall-v2 { left: 380px; top: 300px; width: 8px; height: 68px; box-shadow: inset -2px 0 0 #353a4e; }
  #wall-h { left: 388px; top: 176px; width: 220px; height: 8px; box-shadow: inset 0 -2px 0 #353a4e; }
  #door { position: absolute; left: 276px; top: 8px; width: 56px; height: 48px; background: #20222e; border: 4px solid #6b5436; border-bottom: 0; box-sizing: border-box; z-index: 2; }
  #door::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #b8824c; }
  #label { position: absolute; left: 8px; top: 8px; z-index: 900; padding: 2px 6px; background: #1c1e26; color: #f0aa28;
    border: 2px solid #8a6a2a; font: bold 10px "Courier New", monospace; letter-spacing: 1px; image-rendering: auto; }
  .s { position: absolute; transform-origin: 0 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage">
<div id="office">
  <div class="zone" id="team"></div>
  <div class="zone" id="kitchen"></div>
  <div class="zone" id="meet"></div>
  <div class="wall" id="wall-top"></div>
  <div class="wall" id="wall-v"></div>
  <div class="wall" id="wall-v2"></div>
  <div class="wall" id="wall-h"></div>
  <div id="door"></div>
  <div id="label">AGENTS OFFICE</div>
</div>
</div>
<script>
  // The scene is designed at 608x368; the stage is scaled to fit the viewport (contain, centred).
  // Integer scale when the fit is 1 or more, so pixels stay crisp; fractional below 1.
  const stage = document.getElementById('stage')
  const fitStage = () => {
    const raw = Math.min(innerWidth / 608, innerHeight / 368)
    const k = raw >= 1 ? Math.floor(raw) : raw
    stage.style.transform = 'translate(' + Math.round((innerWidth - 608 * k) / 2) + 'px,' + Math.round((innerHeight - 368 * k) / 2) + 'px) scale(' + k + ')'
  }
  addEventListener('resize', fitStage)
  fitStage()
  const office = document.getElementById('office')
  // x = left, foot = bottom y, scale = display multiple of the sprite pixels
  const spr = (name, x, foot, scale, z) => {
    const e = document.createElement('img')
    e.className = 's'
    e.src = 'sprites/' + name + '.png'
    e.style.left = x + 'px'
    e.style.bottom = (368 - foot) + 'px'
    e.style.transform = 'scale(' + scale + ')'
    e.style.zIndex = z === undefined ? foot : z
    office.appendChild(e)
    return e
  }
  // back wall furniture
  spr('bookshelf', 4, 112, 2)
  spr('filing-cabinet', 76, 112, 2)
  spr('server-rack', 122, 112, 2)
  spr('wall-clock', 190, 52, 1.5, 3)
  spr('plant-tall', 334, 116, 2)
  spr('coffee-machine', 392, 112, 2)
  spr('fridge', 474, 112, 2)
  spr('water-cooler', 530, 112, 2)
  // team room desks (foot y 226), seated people behind them
  spr('desk-monitor', 16, 226, 2, 226); spr('mug', 22, 204, 0.8, 227)
  spr('desk-dual', 128, 226, 2, 226);   spr('mug', 196, 206, 0.8, 227)
  spr('desk-monitor', 252, 226, 2, 226); spr('laptop-closed', 262, 206, 0.7, 227)
  spr('chair', 28, 186, 2, 120);  spr('person1-down', 28, 182, 2, 150)
  spr('chair', 154, 186, 2, 120); spr('person7-down', 154, 182, 2, 150)
  spr('chair', 270, 188, 2, 120)
  // standing at desk 3
  spr('person2-left', 326, 232, 2)
  // kitchen
  spr('cat-orange-walk', 420, 166, 2)
  spr('cat-bed', 516, 170, 2)
  // meeting corner
  spr('whiteboard', 516, 262, 2)
  spr('person8-right', 462, 262, 2)
  spr('round-table', 412, 350, 2)
  spr('plant-small', 560, 360, 2)
  spr('plant-tall', 4, 358, 2)
  spr('sofa', 150, 366, 1.5)

  // walker: loops the lower team room with a 2-frame bob
  const L = 30, R = 300, T = 262, B = 340
  const per = 2 * ((R - L) + (B - T))
  const wk = spr('person6-down', 0, 0, 2, 0)
  const walkerAt = t => {
    let d = (t / 1000 * 40) % per
    let x, y, dir
    if (d < R - L) { x = L + d; y = T; dir = 'right' }
    else if ((d -= R - L) < B - T) { x = R; y = T + d; dir = 'down' }
    else if ((d -= B - T) < R - L) { x = R - d; y = B; dir = 'left' }
    else { d -= R - L; x = L; y = B - d; dir = 'up' }
    return { x, y, dir }
  }

  // wanderers: pick a point, walk to it slowly, pause, repeat
  const wanderer = (prefix, scale, x, y, speed) =>
    ({ prefix, x, y, tx: x, ty: y, pause: 0, speed, el: spr(prefix + '-down', x, y, scale, y), face: 'down' })
  const pets = [wanderer('mascot', 2, 90, 330, 14), wanderer('corgi', 2, 250, 300, 18)]
  const bounds = { x0: 20, x1: 540, y0: 262, y1: 350 }
  const rnd = (a, b) => a + Math.random() * (b - a)

  let last = performance.now()
  const tick = now => {
    const dt = Math.min(0.1, (now - last) / 1000)
    last = now
    const wp = walkerAt(now)
    const bob = Math.floor(now / 220) % 2 ? -2 : 0
    wk.src = 'sprites/person6-' + wp.dir + '.png'
    wk.style.left = wp.x + 'px'
    wk.style.bottom = (368 - wp.y - bob) + 'px'
    wk.style.zIndex = Math.round(wp.y)
    for (const p of pets) {
      if (p.pause > 0) p.pause -= dt
      else {
        const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy)
        if (dist < 2) { p.tx = rnd(bounds.x0, bounds.x1); p.ty = rnd(bounds.y0, bounds.y1); p.pause = rnd(1, 4) }
        else {
          p.x += dx / dist * p.speed * dt; p.y += dy / dist * p.speed * dt
          const face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')
          if (face !== p.face) { p.face = face; p.el.src = 'sprites/' + p.prefix + '-' + face + '.png' }
        }
      }
      p.el.style.left = p.x + 'px'
      p.el.style.bottom = (368 - p.y) + 'px'
      p.el.style.zIndex = Math.round(p.y)
    }
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)

  window.setState = state => {
    if (state && typeof state.label === 'string') document.getElementById('label').textContent = state.label
  }
</script>
</body>
</html>
