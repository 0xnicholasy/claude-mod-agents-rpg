name: ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']
jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
